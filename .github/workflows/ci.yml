name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checkout:
    name: Checkout widget tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test scripts/checkout.test.mjs scripts/hasp-agent.test.mjs
      - name: The agent's dry run against live NEAR Intents
        run: |
          if node scripts/hasp-agent.mjs buy --to sithunyein.near --usd 1 --item "A CI dry run" > agent.out 2>&1; then
            echo "::notice title=Agent dry run (mainnet quote, nothing sent)::$(cat agent.out | tr '\n' '|')"
          else
            echo "::warning title=Agent dry run::$(cat agent.out | tr '\n' '|')"
          fi
          node scripts/hasp-agent.mjs buy --to stranger.near --usd 1 > stop.out 2>&1; code=$?
          echo "::notice title=Agent stopped by its rule (exit $code)::$(cat stop.out | tr '\n' '|')"
          test "$code" = 2

  reviewer:
    name: What a reviewer runs after cloning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: npm ci
        run: |
          if ! npm ci --no-audit --no-fund > ci.out 2>&1; then
            echo "::error title=npm ci::$(tail -40 ci.out | tr '\n' '|' | cut -c1-6000)"
            exit 1
          fi
      - name: npm test
        run: |
          if ! npm test > test.out 2>&1; then
            echo "::error title=npm test::$(grep -E 'not ok|Error|error' test.out | head -30 | tr '\n' '|' | cut -c1-6000)"
            exit 1
          fi
          echo "::notice title=npm test::$(grep -E '^# (tests|pass|fail)' test.out | tr '\n' ' ')"
      - name: npm run typecheck
        run: |
          if ! npx tsc --noEmit > tsc.out 2>&1; then
            echo "::error title=Type check::$(grep -E 'error TS' tsc.out | head -40 | tr '\n' '|' | cut -c1-6000)"
            exit 1
          fi
      - name: npm run build
        run: |
          if ! npm run build > build.out 2>&1; then
            echo "::error title=npm run build::$(tail -60 build.out | tr '\n' '|' | cut -c1-6000)"
            exit 1
          fi
      - name: npm run dev answers on 127.0.0.1:8080
        run: |
          npm run dev > dev.out 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf -o page.html http://127.0.0.1:8080/; then break; fi
            sleep 2
          done
          if ! grep -qi hasp page.html; then
            echo "::error title=npm run dev::$(tail -30 dev.out | tr '\n' '|' | cut -c1-6000)"
            exit 1
          fi
          curl -sf -o checkout.js http://127.0.0.1:8080/checkout.js && echo "::notice title=npm run dev::the site and /checkout.js answered on port 8080"
